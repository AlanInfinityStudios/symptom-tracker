<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Symptom Tracker</title>
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121619" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#1b2328; --muted:#5d6b75; --line:#dde3e8;
  --accent:#1f6f8b; --accent-ink:#ffffff; --accent-soft:#e2f0f5;
  --event:#c2410c; --event-soft:#fdeee5; --wet:#2563eb; --wet-soft:#e6eefe; --note:#6d5a9c; --note-soft:#efebf8;
  --ok:#2f7d4f; --warn:#a15c00; --danger:#b42318;
  --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121619; --card:#1b2126; --ink:#e7edf1; --muted:#9aa8b2; --line:#2c353c;
    --accent:#5bb3d1; --accent-ink:#0b1a20; --accent-soft:#183039;
    --event:#fb8c55; --event-soft:#3a2418; --wet:#7aa7ff; --wet-soft:#1c2740; --note:#b7a5ea; --note-soft:#2a2440;
    --ok:#6fcf97; --warn:#f2b45a; --danger:#ff8a80; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0) 0 calc(76px + env(safe-area-inset-bottom,0)) 0}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
main{max-width:640px;margin:0 auto;padding:12px 16px 24px}
header.top{max-width:640px;margin:0 auto;padding:14px 16px 4px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:20px;margin:0;flex:1;letter-spacing:-.01em}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;background:none;border:0;padding:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.pending{background:var(--warn)} .dot.off{background:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.55}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.big-event{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:132px;border-radius:20px;border:0;background:var(--event);color:#fff;font-size:24px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
@media (prefers-color-scheme: dark){.big-event{color:#1d0f07}}
.big-event small{font-size:15px;font-weight:500;opacity:.9;margin-top:4px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.quick button{min-height:72px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;padding:10px;text-align:left;display:flex;flex-direction:column;justify-content:center}
.quick button small{font-weight:400;color:var(--muted);font-size:13px}
.quick .k-event{border-left:5px solid var(--event)} .quick .k-wet{border-left:5px solid var(--wet)} .quick .k-note{border-left:5px solid var(--note)}
label.f{display:block;margin:0 0 14px;font-weight:600;font-size:15px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:400;min-height:48px}
label.f textarea{min-height:90px;resize:vertical}
.fs{margin:0 0 16px;border:0;padding:0}
.fs legend{font-weight:600;font-size:15px;padding:0;margin-bottom:8px}
.fs .hint{font-weight:400;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:15px}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-weight:600}
.check input{width:22px;height:22px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:0 72px env(safe-area-inset-bottom,0) 0;z-index:5}
/* the right-hand 72px is left clear for the "Powered by Netlify" badge on the free plan */
nav.tabs button{flex:1;max-width:160px;background:none;border:0;padding:10px 4px 12px;font-size:13px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.entry{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.entry:first-child{border-top:0}
.tag{flex:none;width:10px;border-radius:6px;background:var(--event)}
.tag.bedwetting{background:var(--wet)} .tag.daynote{background:var(--note)}
.entry .t{font-weight:600} .entry .d{font-size:14px;color:var(--muted)}
.day-h{font-size:14px;font-weight:700;color:var(--muted);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0))}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 14px;font-size:20px}
.sheet .bar{display:flex;gap:10px;position:sticky;bottom:-18px;background:var(--card);padding:12px 0 4px;margin-top:8px}
.sheet .bar .btn{flex:1}
.timer{text-align:center;padding:12px 0}
.timer .secs{font-size:72px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:6px 0}
.stop{width:100%;min-height:140px;border-radius:20px;border:0;background:var(--event);color:#fff;font-size:26px;font-weight:700;cursor:pointer}
@media (prefers-color-scheme: dark){.stop{color:#1d0f07}}
.notice{background:var(--accent-soft);border-radius:12px;padding:12px;font-size:14px;margin:0 0 12px}
.warnbox{background:var(--event-soft);border-radius:12px;padding:12px;font-size:15px;margin:12px 0;text-align:left}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;font-size:15px;max-width:90vw;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 0}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--muted)}
.code{font-size:30px;font-weight:700;letter-spacing:.15em;text-align:center;padding:12px;background:var(--bg);border-radius:12px;margin:8px 0;user-select:all}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
a{color:var(--accent)}
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <h1 id="title">Symptom Tracker</h1>
  <button class="sync" id="syncBtn" data-act="sync" aria-label="Sync status"><span class="dot" id="syncDot"></span><span id="syncText">Synced</span></button>
</header>
<main id="app"><p class="muted">Loading…</p></main>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Log</button>
  <button data-tab="diary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Diary</button>
  <button data-tab="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Report</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
</nav>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script src="/vendor/supabase-2.117.3.js"></script>
<script src="/vendor/jspdf-4.2.1.umd.min.js"></script>
<script>
"use strict";
/* ---------- Config (filled in by build.mjs) ---------- */
const CONFIG = { supabaseUrl: "__SUPABASE_URL__", supabaseKey: "__SUPABASE_KEY__", mockUrl: "__MOCK_URL__" };

/* ---------- Wording ---------- */
const DURATIONS = [["brief","About 2 to 3 seconds"],["short","About 5 to 10 seconds"],["long","About 20 seconds"],["longer","Longer than 30 seconds"]];
const CERTAINTY = [["definite","Definitely saw it"],["probable","Think so"],["unsure","Not sure"]];
const BEFORE = [["eating","Eating"],["screen","Screen or TV"],["reading","Reading"],["talking","Talking"],["playing","Playing"],["car","In the car"],["woken","Just woken up"],["drowsy","Falling asleep"],["other","Something else"]];
const SIGNS = [["staring","Staring"],["eyelids","Eyelids fluttering"],["mouth","Chewing or lip movements"],["hands","Hand or finger movements"],["headdrop","Head drop"],["sound","Made a sound"],["oneside","One side only"]];
const RESPONDED = [["yes","Yes"],["partly","Partly"],["no","No"],["untested","Didn't try"]];
const AFTER = [["normal","Straight back to normal"],["confused","Confused"],["tired","Tired"],["asleep","Fell asleep"]];
const FACTORS = [["poorsleep","Poor sleep"],["unwell","Unwell or temperature"],["missedmeal","Missed a meal"],["stress","Stressed or upset"],["hot","Very hot"],["exercise","Lots of exercise"]];
const WET_TYPE = [["accident","Small accident, didn't make it in time"],["soaked","Soaked through, out of it"]];
const YESNO = [["yes","Yes"],["no","No"],["unknown","Don't know"]];
const SLEEP = [["good","Good"],["ok","OK"],["poor","Poor"]];
const MOOD = [["good","Good"],["ok","OK"],["low","Low or grumpy"]];
const lbl = (list, v) => { const f = list.find(x => x[0] === v); return f ? f[1] : (v || ""); };
const low = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : "";
const bandFor = s => s == null || s === "" ? "" : s <= 4 ? "brief" : s <= 12 ? "short" : s <= 30 ? "long" : "longer";

/* ---------- Small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));
const pad = n => String(n).padStart(2, "0");
const toLocalInput = d => { d = new Date(d); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes()); };
const dayKey = d => { d = new Date(d); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const fmtTime = d => new Date(d).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const fmtDay = d => new Date(d).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const fmtDate = d => new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const store = {
  get(k, def) { try { const v = localStorage.getItem("st." + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem("st." + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem("st." + k); } catch (e) {} }
};
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
function chips(name, list, value, multi) {
  const vals = multi ? (value || []) : [value];
  return '<div class="chips">' + list.map(([v, l]) => '<label class="chip"><input type="' + (multi ? "checkbox" : "radio") + '" name="' + name + '" value="' + v + '"' + (vals.includes(v) ? " checked" : "") + '><span>' + esc(l) + '</span></label>').join("") + "</div>";
}
function fieldset(legend, inner, hint) { return '<fieldset class="fs"><legend>' + esc(legend) + (hint ? ' <span class="hint">' + esc(hint) + '</span>' : "") + "</legend>" + inner + "</fieldset>"; }
const radioVal = (form, n) => { const el = form.querySelector('input[name="' + n + '"]:checked'); return el ? el.value : ""; };
const checkVals = (form, n) => [...form.querySelectorAll('input[name="' + n + '"]:checked')].map(x => x.value);

/* ---------- Backend: Supabase, or a test server when CONFIG.mockUrl is set ---------- */
const realUrl = v => v && !/^__/.test(v);
const api = (() => {
  if (realUrl(CONFIG.mockUrl)) return mockApi(CONFIG.mockUrl);
  const sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  const ok = r => { if (r.error) throw r.error; return r.data; };
  return {
    async session() { const { data } = await sb.auth.getSession(); return data.session ? { userId: data.session.user.id, email: data.session.user.email } : null; },
    async signIn(email, password) { const r = await sb.auth.signInWithPassword({ email, password }); ok(r); return { userId: r.data.user.id, email }; },
    async signUp(email, password) { const r = await sb.auth.signUp({ email, password }); ok(r); if (!r.data.session) throw new Error("Account created, but Supabase wants the email confirmed first. Turn off 'Confirm email' in Supabase (see the README), then sign in."); return { userId: r.data.user.id, email }; },
    async signOut() { await sb.auth.signOut(); },
    async myDiaries(userId) { return ok(await sb.from("diary_members").select("diary_id,label,role,joined_at").eq("user_id", userId).order("joined_at")); },
    async createDiary(label) { return ok(await sb.rpc("create_diary", { my_label: label })); },
    async createInvite(diaryId) { return ok(await sb.rpc("create_invite", { d: diaryId })); },
    async joinDiary(code, label) { return ok(await sb.rpc("join_diary", { invite_code: code, my_label: label })); },
    async members(diaryId) { return ok(await sb.from("diary_members").select("user_id,label,role").eq("diary_id", diaryId)); },
    async setLabel(diaryId, userId, label) { ok(await sb.from("diary_members").update({ label }).eq("diary_id", diaryId).eq("user_id", userId)); },
    async upsert(rows) { return ok(await sb.from("entries").upsert(rows.map(r => ({ id: r.id, diary_id: r.diary_id, kind: r.kind, occurred_at: r.occurred_at, data: r.data, deleted: !!r.deleted }))).select()); },
    async pull(diaryId, since) {
      let q = sb.from("entries").select("*").eq("diary_id", diaryId).order("updated_at").limit(1000);
      if (since) q = q.gt("updated_at", since);
      return ok(await q);
    },
    subscribe(diaryId, onRow) {
      const ch = sb.channel("entries-" + diaryId).on("postgres_changes", { event: "*", schema: "public", table: "entries", filter: "diary_id=eq." + diaryId }, p => p.new && onRow(p.new)).subscribe();
      return () => sb.removeChannel(ch);
    },
    async deleteDiary(diaryId) { ok(await sb.rpc("delete_diary", { d: diaryId })); }
  };
})();

function mockApi(base) {
  const call = async (op, body) => {
    const tok = store.get("mockToken");
    const r = await fetch(base + "/" + op, { method: "POST", headers: { "content-type": "application/json", authorization: tok || "" }, body: JSON.stringify(body || {}) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || "Server error"); return j;
  };
  return {
    async session() { const s = store.get("mockSession"); return s || null; },
    async signIn(email, password) { const s = await call("signIn", { email, password }); store.set("mockToken", s.userId); store.set("mockSession", s); return s; },
    async signUp(email, password) { const s = await call("signUp", { email, password }); store.set("mockToken", s.userId); store.set("mockSession", s); return s; },
    async signOut() { store.del("mockToken"); store.del("mockSession"); },
    myDiaries: () => call("myDiaries"), createDiary: label => call("createDiary", { label }), createInvite: d => call("createInvite", { d }),
    joinDiary: (code, label) => call("joinDiary", { code, label }), members: d => call("members", { d }), setLabel: (d, u, label) => call("setLabel", { d, label }),
    upsert: rows => call("upsert", { rows }), pull: (d, since) => call("pull", { d, since }), deleteDiary: d => call("deleteDiary", { d }),
    subscribe(d, onRow) { let since = new Date().toISOString(); const t = setInterval(async () => { try { const rows = await call("pull", { d, since }); rows.forEach(r => { onRow(r); if (r.updated_at > since) since = r.updated_at; }); } catch (e) {} }, 1000); return () => clearInterval(t); }
  };
}

/* ---------- App state ---------- */
const S = {
  user: null,           // { userId, email }
  diaryId: store.get("diary", null),
  members: [],          // [{ user_id, label, role }]
  entries: {},          // id -> entry
  queue: {},            // id -> entry waiting to upload
  online: navigator.onLine, syncing: false, syncError: "",
  tab: "home", filter: "all", unsub: null
};
function loadDiaryCache() {
  const c = store.get("cache." + S.diaryId, {});
  S.entries = c.entries || {}; S.members = c.members || []; S.lastPull = c.lastPull || null;
  S.queue = store.get("queue." + S.diaryId, {});
}
function saveDiaryCache() {
  store.set("cache." + S.diaryId, { entries: S.entries, members: S.members, lastPull: S.lastPull });
  store.set("queue." + S.diaryId, S.queue);
}
const child = () => store.get("child." + S.diaryId, {});
const myLabel = () => { const m = S.members.find(x => x.user_id === (S.user && S.user.userId)); return m ? m.label : store.get("myLabel", "Me"); };
const whoLabel = uid => { const m = S.members.find(x => x.user_id === uid); return m ? m.label : "Someone"; };
const liveEntries = () => Object.values(S.entries).filter(e => !e.deleted).sort((a, b) => b.occurred_at.localeCompare(a.occurred_at));

/* ---------- Sync ---------- */
function mergeRow(row) {
  if (S.queue[row.id]) return false; // our own unsent change wins until it is sent
  const cur = S.entries[row.id];
  if (cur && cur.updated_at && row.updated_at && cur.updated_at > row.updated_at && !cur._local) return false;
  S.entries[row.id] = row; return true;
}
async function syncNow(quiet) {
  if (!S.diaryId || !S.user || S.syncing) return;
  S.syncing = true; setSyncUi();
  try {
    const pending = Object.values(S.queue);
    if (pending.length) {
      const saved = await api.upsert(pending);
      (saved || []).forEach(r => { delete S.queue[r.id]; S.entries[r.id] = r; });
      if (!saved || !saved.length) pending.forEach(p => delete S.queue[p.id]);
    }
    const since = S.lastPull ? new Date(new Date(S.lastPull).getTime() - 120000).toISOString() : null;
    const rows = await api.pull(S.diaryId, since);
    let max = S.lastPull;
    rows.forEach(r => { mergeRow(r); if (!max || r.updated_at > max) max = r.updated_at; });
    S.lastPull = max;
    try { S.members = await api.members(S.diaryId); } catch (e) {}
    S.syncError = ""; S.online = true;
  } catch (e) {
    S.syncError = (e && e.message) || "Could not reach the server";
    if (!navigator.onLine || /fetch|network|Failed/i.test(S.syncError)) S.online = false;
  } finally {
    S.syncing = false; saveDiaryCache(); setSyncUi(); if (!$(".sheet")) render();
  }
}
function setSyncUi() {
  const n = Object.keys(S.queue).length;
  const dot = $("#syncDot"), txt = $("#syncText");
  dot.className = "dot" + (n ? " pending" : "") + (!S.online ? " off" : "");
  txt.textContent = S.syncing ? "Syncing…" : n ? n + " waiting to sync" : !S.online ? "Offline" : "Synced";
}
function saveEntry(entry) {
  entry.updated_at = new Date().toISOString(); entry._local = true;
  if (!entry.created_by) entry.created_by = S.user.userId;
  S.entries[entry.id] = entry;
  S.queue[entry.id] = { id: entry.id, diary_id: entry.diary_id, kind: entry.kind, occurred_at: entry.occurred_at, data: entry.data, deleted: !!entry.deleted };
  saveDiaryCache(); setSyncUi(); syncNow(true);
}
function startLive() {
  if (S.unsub) S.unsub();
  S.unsub = api.subscribe(S.diaryId, row => { if (mergeRow(row)) { saveDiaryCache(); if (!$(".sheet")) render(); } });
}
window.addEventListener("online", () => { S.online = true; syncNow(true); });
window.addEventListener("offline", () => { S.online = false; setSyncUi(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(true); });
setInterval(() => { if (Object.keys(S.queue).length) syncNow(true); }, 30000);

/* ---------- Describing entries ---------- */
function durText(d) { return d.seconds ? d.seconds + " seconds" : d.duration ? lbl(DURATIONS, d.duration).replace("About ", "about ") : "length not noted"; }
function entryTitle(e) {
  const d = e.data || {};
  if (e.kind === "event") return "Event, " + durText(d);
  if (e.kind === "bedwetting") return d.type === "soaked" ? "Bedwetting, soaked through" : d.type === "accident" ? "Bedwetting, small accident" : "Bedwetting";
  return "Day note";
}
function entryDetails(e, long) {
  const d = e.data || {}, out = [];
  if (e.kind === "event") {
    if (d.certainty) out.push(lbl(CERTAINTY, d.certainty));
    if (d.seenBy) out.push("seen by " + d.seenBy);
    if (d.before && d.before.length) out.push("before: " + d.before.map(v => v === "other" && d.beforeOther ? d.beforeOther : low(lbl(BEFORE, v))).join(", "));
    if (long && d.signs && d.signs.length) out.push("noticed: " + d.signs.map(v => low(lbl(SIGNS, v))).join(", "));
    if (long && d.responded) out.push("responded: " + low(lbl(RESPONDED, d.responded)));
    if (d.after && d.after.length) out.push("after: " + d.after.map(v => low(lbl(AFTER, v))).join(", "));
    if (d.sleptAt) out.push("asleep at " + d.sleptAt + (d.sleptMins ? " for about " + d.sleptMins + " min" : ""));
    if (d.video) out.push("video taken");
    if (long && d.factors && d.factors.length) out.push("factors: " + d.factors.map(v => low(lbl(FACTORS, v))).join(", "));
  } else if (e.kind === "bedwetting") {
    if (d.foundMorning) out.push("found in the morning");
    if (d.hardToWake) out.push("hard to wake or confused: " + low(lbl(YESNO, d.hardToWake)));
  } else {
    if (d.sleep) out.push("sleep last night: " + low(lbl(SLEEP, d.sleep)));
    if (d.unwell) out.push("unwell");
    if (d.mood) out.push("mood: " + low(lbl(MOOD, d.mood)));
  }
  if (d.notes) out.push(long ? "notes: " + d.notes : "“" + (d.notes.length > 80 ? d.notes.slice(0, 80) + "…" : d.notes) + "”");
  return out.join(" · ");
}
function entryRow(e) {
  const by = whoLabel(e.created_by);
  return '<button class="entry" data-act="edit" data-id="' + e.id + '"><span class="tag ' + e.kind + '"></span><span><span class="t">' + esc(entryTitle(e)) + '</span><br><span class="d">' + esc((e.kind === "daynote" ? "" : fmtTime(e.occurred_at) + " · ") + entryDetails(e)) + (by ? " · logged by " + esc(by) : "") + (S.queue[e.id] ? " · not synced yet" : "") + "</span></span></button>";
}

/* ---------- Screens ---------- */
function render() {
  const app = $("#app");
  if (!S.user) { $("#top").hidden = true; $("#tabs").hidden = true; app.innerHTML = authView(); return; }
  if (!S.diaryId) { $("#top").hidden = true; $("#tabs").hidden = true; app.innerHTML = setupView(); return; }
  $("#top").hidden = false; $("#tabs").hidden = false;
  $("#title").textContent = child().name ? child().name + "'s diary" : "Symptom Tracker";
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
  app.innerHTML = S.tab === "home" ? homeView() : S.tab === "diary" ? diaryView() : S.tab === "report" ? reportView() : moreView();
  setSyncUi();
}

  const keys = Object.keys(groups).sort().reverse();

/* ---------- Entry forms ---------- */
function openSheet(html) { $("#sheet").innerHTML = '<div class="sheet-wrap" data-act="closebg"><div class="sheet" role="dialog" aria-modal="true">' + html + "</div></div>"; document.body.style.overflow = "hidden"; }
function closeSheet() { if (S.timerInt) { clearInterval(S.timerInt); S.timerInt = null; } $("#sheet").innerHTML = ""; document.body.style.overflow = ""; render(); }

function seenByOptions() {
  const labels = [...new Set([...(S.members.map(m => m.label)), myLabel(), "Grandparent", "School", "Other"])];
  return labels.map(l => [l, l]);
}

function eventForm(e) {

    '<label class="check"><input type="checkbox" name="video"' + (d.video ? " checked" : "") + "> Video taken (sent separately)</label>" +

}
function wetForm(e) {

function noteForm(e) {
  const d = e.data || {};
  return '<form id="entryForm" data-id="' + e.id + '"><h2>Day note</h2>' +
    '<label class="f">Day<input type="date" name="day" value="' + esc(d.day || dayKey(new Date())) + '" required></label>' +

    '<label class="f">Notes on the day<textarea name="notes" placeholder="Anything you think is worth mentioning.">' + esc(d.notes || "") + "</textarea></label>" + formBar(e) + "</form>";
}
function formBar(e) {
  return (S.entries[e.id] ? '<p class="small muted">Logged by ' + esc(whoLabel(e.created_by)) + (e.updated_by && e.updated_by !== e.created_by ? ", last changed by " + esc(whoLabel(e.updated_by)) : "") + '.</p><button type="button" class="btn danger block" data-act="delete" data-id="' + e.id + '">Delete this entry</button>' : "") +
    '<div class="bar"><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn primary">Save</button></div>';
}
function openEntry(e) {
  S.editing = e;
  openSheet(e.kind === "event" ? eventForm(e) : e.kind === "bedwetting" ? wetForm(e) : noteForm(e));
}
function blankEntry(kind, extra) { return { id: uuid(), diary_id: S.diaryId, kind, occurred_at: new Date().toISOString(), data: Object.assign({}, extra || {}) }; }

function readForm(form) {
  const e = JSON.parse(JSON.stringify(S.editing)); const d = e.data = e.data || {};
  const notes = form.notes ? form.notes.value.trim() : "";
  if (e.kind === "event") {
    e.occurred_at = new Date(form.when.value).toISOString();
    const secs = form.seconds.value ? Math.max(0, parseInt(form.seconds.value, 10)) : null;
    Object.assign(d, { seconds: secs, duration: radioVal(form, "duration") || bandFor(secs), certainty: radioVal(form, "certainty"), seenBy: radioVal(form, "seenBy"),
      before: checkVals(form, "before"), beforeOther: form.beforeOther.value.trim(), signs: checkVals(form, "signs"), responded: radioVal(form, "responded"),
      after: checkVals(form, "after"), sleptAt: form.sleptAt.value, sleptMins: form.sleptMins.value ? parseInt(form.sleptMins.value, 10) : null,
      video: form.video.checked, factors: checkVals(form, "factors"), notes });
    if (!d.after.includes("asleep")) { d.sleptAt = ""; d.sleptMins = null; }
  } else if (e.kind === "bedwetting") {
    e.occurred_at = new Date(form.when.value).toISOString();
    Object.assign(d, { foundMorning: form.foundMorning.checked, type: radioVal(form, "type"), hardToWake: radioVal(form, "hardToWake"), notes });
  } else {
    d.day = form.day.value; e.occurred_at = new Date(d.day + "T20:00").toISOString();
    Object.assign(d, { sleep: radioVal(form, "sleep"), unwell: form.unwell.checked, mood: radioVal(form, "mood"), notes });
  }
  return e;
}

/* ---------- Timer and brief event ---------- */
function openTimer() {
  const start = Date.now(); S.timerStart = start;
  openSheet('<div class="timer"><h2>Event in progress</h2><p class="muted">Tap the button as soon as it ends.</p><div class="secs" id="tSecs">0</div><p class="muted" style="margin-top:-6px">seconds</p>' +
    '<div id="tWarn"></div><button class="stop" data-act="stoptimer">It\'s over</button><button class="btn block" style="margin-top:12px" data-act="close">Cancel, not an event</button></div>');
  S.timerInt = setInterval(() => {
    const s = Math.floor((Date.now() - start) / 1000); const el = $("#tSecs"); if (el) el.textContent = s;
    if (s >= 300 && $("#tWarn") && !$("#tWarn").innerHTML) $("#tWarn").innerHTML = '<div class="warnbox"><b>This is a long one.</b> Follow the advice your paediatrician gave you. If you are worried, call 999.</div>';
  }, 250);
}
function stopTimer() {
  const secs = Math.max(1, Math.round((Date.now() - S.timerStart) / 1000));
  clearInterval(S.timerInt); S.timerInt = null;
  const e = blankEntry("event", { seconds: secs, duration: bandFor(secs), seenBy: myLabel(), certainty: "definite" });
  e.occurred_at = new Date(S.timerStart).toISOString();
  saveEntry(e); toast("Saved: " + secs + " seconds. Add any details now or later.");
  openEntry(e);
}
function openBrief() {
  openSheet('<h2>Brief event</h2><p class="muted" style="margin-top:-6px">Logged as now, about 2 to 3 seconds. How sure are you?</p>' +
    CERTAINTY.map(([v, l]) => '<button class="btn block" style="margin-bottom:10px;min-height:60px;font-size:18px" data-act="savebrief" data-v="' + v + '">' + l + "</button>").join("") +
    '<button class="btn block" data-act="close" style="margin-top:6px">Cancel</button>');
}

/* ---------- Report ---------- */
function reportData(from, to) {
  const a = new Date(from + "T00:00"), b = new Date(to + "T23:59:59.999");
  const inRange = e => { const t = e.kind === "daynote" && e.data.day ? new Date(e.data.day + "T12:00") : new Date(e.occurred_at); return t >= a && t <= b; };
  const list = liveEntries().filter(inRange).reverse();
  return { from, to, a, b, list, events: list.filter(e => e.kind === "event"), wets: list.filter(e => e.kind === "bedwetting"), notes: list.filter(e => e.kind === "daynote") };
}
function countBy(list, fn) { const m = {}; list.forEach(x => [].concat(fn(x) || []).forEach(k => { if (k) m[k] = (m[k] || 0) + 1; })); return m; }

function makePdf() {
  const from = $("#rFrom").value, to = $("#rTo").value;
  if (!from || !to || from > to) { toast("Check the dates"); return; }
  const R = reportData(from, to), c = child();
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: "mm", format: "a4" });
  const W = 210, M = 15, CW = W - 2 * M; let y = M;
  const ink = [27, 35, 40], muted = [93, 107, 117], evC = [194, 65, 12], wetC = [37, 99, 235], line = [221, 227, 232];
  const setC = c => doc.setTextColor(c[0], c[1], c[2]);
  const ensure = h => { if (y + h > 297 - M) { doc.addPage(); y = M; } };
  const h2 = t => { ensure(14); y += 4; doc.setFont("helvetica", "bold"); doc.setFontSize(13); setC(ink); doc.text(t, M, y); y += 6; doc.setFont("helvetica", "normal"); doc.setFontSize(10); };
  const para = (t, size, col) => { doc.setFontSize(size || 10); setC(col || ink); doc.splitTextToSize(t, CW).forEach(l => { ensure(5); doc.text(l, M, y); y += (size || 10) * 0.45; }); };

  // Header
  doc.setFont("helvetica", "bold"); doc.setFontSize(18); setC(ink); doc.text("Events diary", M, y + 4); y += 11;
  doc.setFont("helvetica", "normal"); doc.setFontSize(11);
  const idLines = [["Name", c.name || "(not entered)"], ["Date of birth", c.dob ? fmtDate(c.dob + "T12:00") : ""], ["NHS or hospital number", c.nhs || ""], ["Paediatrician", c.doctor || ""],
    ["Period", fmtDate(R.a) + " to " + fmtDate(R.b)], ["Recorded by", S.members.map(m => m.label).join(", ") || myLabel()], ["Report made", fmtDate(new Date())]].filter(x => x[1]);
  idLines.forEach(([k, v]) => { setC(muted); doc.text(k, M, y); setC(ink); doc.text(String(v), M + 48, y); y += 5.5; });
  y += 1; para("Recorded by parents as observed. The word \"event\" is used because there is no diagnosis. \"Definitely saw it\", \"Think so\" and \"Not sure\" show how confident the person was.", 9, muted);
  doc.setDrawColor(line[0], line[1], line[2]); doc.line(M, y, W - M, y); y += 2;

  // Summary
  h2("Summary");
  const cert = countBy(R.events, e => e.data.certainty), dur = countBy(R.events, e => e.data.duration || bandFor(e.data.seconds));
  const wt = countBy(R.wets, e => e.data.type);
  const eventDays = new Set(R.events.map(e => dayKey(e.occurred_at)));
  const timed = R.events.filter(e => e.data.seconds).map(e => e.data.seconds);
  const sleptAfter = R.events.filter(e => (e.data.after || []).includes("asleep")).length;
  const rows = [
    ["Events", R.events.length + (R.events.length ? " on " + eventDays.size + " day" + (eventDays.size === 1 ? "" : "s") : "")],
    ["How sure", CERTAINTY.map(([v, l]) => l + ": " + (cert[v] || 0)).join(";  ")],
    ["Length", DURATIONS.map(([v, l]) => l.replace("About ", "~").replace("Longer than", ">").replace(" seconds", "s") + ": " + (dur[v] || 0)).join(";  ")],
    ["Timed events", timed.length ? timed.length + ", from " + Math.min(...timed) + " to " + Math.max(...timed) + " seconds" : "none timed"],
    ["Fell asleep after", sleptAfter + " event" + (sleptAfter === 1 ? "" : "s")],
    ["Video taken", R.events.filter(e => e.data.video).length + " (sent separately)"],
    ["Bedwetting", R.wets.length + (R.wets.length ? " (soaked through: " + (wt.soaked || 0) + ", small accident: " + (wt.accident || 0) + ")" : "")]
  ];
  // Bedwetting within 24 hours after an event
  if (R.wets.length) {
    const linked = R.wets.filter(w => R.events.some(e => { const dt = new Date(w.occurred_at) - new Date(e.occurred_at); return dt >= 0 && dt <= 864e5; }));
    const soakedLinked = linked.filter(w => w.data.type === "soaked").length;
    rows.push(["Bedwetting within 24h after an event", linked.length + " of " + R.wets.length + (wt.soaked ? " (soaked through: " + soakedLinked + " of " + wt.soaked + ")" : "")]);
  }
  rows.forEach(([k, v]) => { const lines = doc.splitTextToSize(v, CW - 66); ensure(lines.length * 5 + 1); setC(muted); doc.text(k, M, y); setC(ink); doc.text(lines, M + 66, y); y += lines.length * 5 + 0.8; });

  // Calendar
  h2("Calendar");
  setC(muted); doc.setFontSize(8.5);
  doc.setFillColor(evC[0], evC[1], evC[2]); doc.circle(M + 1.5, y - 1, 1.3, "F"); doc.text("events (number shown)", M + 4, y);
  doc.setFillColor(wetC[0], wetC[1], wetC[2]); doc.rect(M + 42, y - 2.4, 2.8, 2.8, "F"); doc.text("bedwetting (filled = soaked through)", M + 46.5, y); y += 5;
  const start = new Date(R.a); start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
  const cellW = CW / 7, cellH = 11, dn = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  dn.forEach((d, i) => doc.text(d, M + i * cellW + 1.5, y)); y += 2;
  const evByDay = countBy(R.events, e => dayKey(e.occurred_at));
  const wetByDay = {}; R.wets.forEach(w => { const k = dayKey(w.occurred_at); wetByDay[k] = wetByDay[k] === "soaked" ? "soaked" : (w.data.type || "accident"); });
  for (let wk = new Date(start); wk <= R.b; wk.setDate(wk.getDate() + 7)) {
    ensure(cellH + 1);
    for (let i = 0; i < 7; i++) {
      const d = new Date(wk); d.setDate(d.getDate() + i); const k = dayKey(d), x = M + i * cellW, inR = d >= new Date(R.a.toDateString()) && d <= R.b;
      doc.setDrawColor(line[0], line[1], line[2]); doc.rect(x, y, cellW, cellH);
      if (!inR) continue;
      doc.setFontSize(7.5); setC(muted); doc.text(d.getDate() === 1 || k === dayKey(R.a) ? d.getDate() + " " + d.toLocaleDateString("en-GB", { month: "short" }) : String(d.getDate()), x + 1.2, y + 3);
      if (evByDay[k]) { doc.setFillColor(evC[0], evC[1], evC[2]); doc.circle(x + 3.5, y + 7.3, 1.8, "F"); doc.setFontSize(9); setC(ink); doc.text(String(evByDay[k]), x + 6.2, y + 8.4); }
      if (wetByDay[k]) { doc.setDrawColor(wetC[0], wetC[1], wetC[2]); doc.setFillColor(wetC[0], wetC[1], wetC[2]); doc.rect(x + cellW - 5.5, y + 5.5, 3.6, 3.6, wetByDay[k] === "soaked" ? "F" : "S"); }
    }
    y += cellH;
  }
  y += 2;

  // Time of day
  if (R.events.length) {
    h2("Time of day of events");
    const blocks = ["00-03", "03-06", "06-09", "09-12", "12-15", "15-18", "18-21", "21-24"], counts = Array(8).fill(0);
    R.events.forEach(e => counts[Math.floor(new Date(e.occurred_at).getHours() / 3)]++);
    const max = Math.max(1, ...counts), bw = CW / 8, bh = 26; ensure(bh + 10);
    counts.forEach((n, i) => {
      const h = n / max * (bh - 4), x = M + i * bw;
      doc.setFillColor(evC[0], evC[1], evC[2]); if (n) doc.rect(x + 3, y + bh - h, bw - 6, h, "F");
      doc.setFontSize(9); setC(ink); if (n) doc.text(String(n), x + bw / 2, y + bh - h - 1.2, { align: "center" });
      setC(muted); doc.setFontSize(8); doc.text(blocks[i], x + bw / 2, y + bh + 4, { align: "center" });
    });
    doc.setDrawColor(line[0], line[1], line[2]); doc.line(M, y + bh, W - M, y + bh); y += bh + 9;

    ensure(48); h2("Around the events");
    const tally = (list, field) => { const m = countBy(R.events, e => e.data[field]); return list.filter(([v]) => m[v]).map(([v, l]) => l + " " + m[v]).join(", ") || "not recorded"; };
    [["Doing just before", tally(BEFORE, "before")], ["Noticed", tally(SIGNS, "signs")], ["Responded", tally(RESPONDED, "responded")], ["Afterwards", tally(AFTER, "after")], ["Other factors that day", tally(FACTORS, "factors")], ["Seen by", Object.entries(countBy(R.events, e => e.data.seenBy)).map(([k, n]) => k + " " + n).join(", ") || "not recorded"]]
      .forEach(([k, v]) => { const lines = doc.splitTextToSize(v, CW - 48); ensure(lines.length * 5 + 1); doc.setFontSize(10); setC(muted); doc.text(k, M, y); setC(ink); doc.text(lines, M + 48, y); y += lines.length * 5 + 0.8; });
  }

  // Full log
  if (y > 297 - M - 60) { doc.addPage(); y = M; } else y += 4;
  h2("Full log");
  let lastDay = "";
  R.list.forEach(e => {
    const k = e.kind === "daynote" && e.data.day ? e.data.day : dayKey(e.occurred_at);
    if (k !== lastDay) { ensure(12); y += 2; doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); setC(ink); doc.text(fmtDay(k + "T12:00") + " " + new Date(k + "T12:00").getFullYear(), M, y); doc.setFont("helvetica", "normal"); y += 5.5; lastDay = k; }
    const col = e.kind === "event" ? evC : e.kind === "bedwetting" ? wetC : [109, 90, 156];
    const head = (e.kind === "daynote" ? "" : (e.kind === "bedwetting" && e.data.foundMorning ? "Morning  " : fmtTime(e.occurred_at) + "  ")) + entryTitle(e);
    const body = doc.splitTextToSize(entryDetails(e, true) + (e.created_by ? " · logged by " + whoLabel(e.created_by) : ""), CW - 6);
    ensure(5 + body.length * 4.4);
    doc.setFillColor(col[0], col[1], col[2]); doc.rect(M, y - 3.2, 1.6, 4.2 + body.length * 4.4, "F");
    doc.setFontSize(10); doc.setFont("helvetica", "bold"); setC(ink); doc.text(head, M + 4, y); doc.setFont("helvetica", "normal"); y += 4.6;
    doc.setFontSize(9); setC(muted); doc.text(body, M + 4, y); y += body.length * 4.4 + 2;
  });
  if (!R.list.length) para("Nothing logged in this period.", 10, muted);

  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setFontSize(8); setC(muted); doc.text((c.name ? c.name + " · " : "") + "Events diary " + fmtDate(R.a) + " to " + fmtDate(R.b) + " · page " + i + " of " + pages, W / 2, 297 - 8, { align: "center" }); }

  const fname = "Events diary " + (c.name ? c.name + " " : "") + from + " to " + to + ".pdf";
  const blob = doc.output("blob"); S.lastPdf = blob;
  const file = new File([blob], fname, { type: "application/pdf" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: fname }).catch(() => downloadBlob(blob, fname));
  } else downloadBlob(blob, fname);
}
function downloadBlob(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }

function exportCsv() {
  const cols = ["kind", "occurred_at", "logged_by", "summary", "details"];
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const rows = liveEntries().reverse().map(e => [e.kind, e.occurred_at, whoLabel(e.created_by), entryTitle(e), entryDetails(e, true)].map(q).join(","));
  downloadBlob(new Blob([cols.join(",") + "\n" + rows.join("\n")], { type: "text/csv" }), "symptom-tracker-backup-" + dayKey(new Date()) + ".csv");
}

/* ---------- Events ---------- */
async function enterDiary(id) {
  S.diaryId = id; store.set("diary", id); loadDiaryCache(); S.tab = "home"; render(); startLive(); await syncNow(true);
}
document.addEventListener("submit", async ev => {
  const f = ev.target; ev.preventDefault();
  if (f.id === "authForm") {
    const err = $("#aErr"); err.textContent = "";
    try { S.user = S.authMode === "up" ? await api.signUp($("#aEmail").value.trim(), $("#aPass").value) : await api.signIn($("#aEmail").value.trim(), $("#aPass").value); await afterSignIn(); }
    catch (e) { err.textContent = friendly(e); }
  } else if (f.id === "newDiaryForm") {
    try { const label = $("#nLabel").value.trim(); store.set("myLabel", label); const id = await api.createDiary(label); await enterDiary(id); toast("Diary started. Make an invite code for your partner in More."); }
    catch (e) { toast(friendly(e)); }
  } else if (f.id === "joinForm") {
    try { const label = $("#jLabel").value.trim(); store.set("myLabel", label); const id = await api.joinDiary($("#jCode").value.trim(), label); await enterDiary(id); toast("Joined. Add your son's details in More."); }
    catch (e) { $("#sErr").textContent = friendly(e); }
  } else if (f.id === "childForm") {
    store.set("child." + S.diaryId, { name: $("#cName").value.trim(), dob: $("#cDob").value, nhs: $("#cNhs").value.trim(), doctor: $("#cDoc").value.trim() });
    toast("Saved on this device"); render();
  } else if (f.id === "entryForm") {
    const e = readForm(f);
    if (e.kind !== "daynote" && isNaN(new Date(e.occurred_at))) { toast("Check the date and time"); return; }
    saveEntry(e); closeSheet(); toast("Saved");
  }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.name === "after") { const box = $("#sleepBox"); if (box) box.hidden = !checkVals(t.form, "after").includes("asleep"); }
  if (t.name === "seconds" && t.form) { const b = bandFor(parseInt(t.value, 10)); const r = t.form.querySelector('input[name="duration"][value="' + b + '"]'); if (r) r.checked = true; }
  if (t.dataset.act === "filter") { S.filter = t.value; render(); }
  if (t.id === "rFrom" || t.id === "rTo") { store.set("reportRange", { from: $("#rFrom").value, to: $("#rTo").value }); render(); }
});
document.addEventListener("click", async ev => {
  const tab = ev.target.closest("nav.tabs button"); if (tab) { S.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (act === "closebg") { if (ev.target === el && !S.timerInt) closeSheet(); return; }
  if (act === "filter") return;
  if (el.tagName === "A") ev.preventDefault();
  if (act === "authmode") { S.authMode = S.authMode === "up" ? "in" : "up"; render(); }
  else if (act === "tab") { S.tab = el.dataset.tab; render(); }
  else if (act === "timer") openTimer();
  else if (act === "stoptimer") stopTimer();
  else if (act === "brief") openBrief();
  else if (act === "savebrief") { saveEntry(blankEntry("event", { duration: "brief", seconds: null, certainty: el.dataset.v, seenBy: myLabel() })); closeSheet(); toast("Brief event saved. Tap it to add details."); }
  else if (act === "new") openEntry(blankEntry(el.dataset.kind, el.dataset.kind === "event" ? { seenBy: myLabel() } : el.dataset.kind === "daynote" ? { day: dayKey(new Date()) } : {}));
  else if (act === "edit") { const e = S.entries[el.dataset.id]; if (e) { if ($(".sheet")) closeSheet(); openEntry(JSON.parse(JSON.stringify(e))); } }
  else if (act === "close") closeSheet();
  else if (act === "delete") { if (confirm("Delete this entry for everyone?")) { const e = JSON.parse(JSON.stringify(S.entries[el.dataset.id])); e.deleted = true; saveEntry(e); closeSheet(); toast("Deleted"); } }
  else if (act === "sync") { await syncNow(); toast(S.syncError ? "Could not sync: " + S.syncError : "Up to date"); }
  else if (act === "range") {
    const to = dayKey(new Date()); let from;
    if (el.dataset.days === "all") { const all = liveEntries(); from = all.length ? dayKey(all[all.length - 1].occurred_at) : to; }
    else from = dayKey(Date.now() - (parseInt(el.dataset.days, 10) - 1) * 864e5);
    store.set("reportRange", { from, to }); render();
  }
  else if (act === "pdf") { try { makePdf(); } catch (e) { console.error(e); toast("Could not make the PDF: " + e.message); } }
  else if (act === "invite") {
    try { const code = await api.createInvite(S.diaryId); $("#inviteOut").innerHTML = '<div class="code">' + esc(code) + '</div><p class="small muted">Send this to your partner. It works once, for 7 days.</p>' + (navigator.share ? '<button class="btn block" style="margin-bottom:10px" data-act="sharecode" data-code="' + esc(code) + '">Share code</button>' : ""); }
    catch (e) { toast(S.online ? friendly(e) : "You need signal to make a code"); }
  }
  else if (act === "sharecode") navigator.share({ text: "Join our diary in Symptom Tracker: " + location.origin + "\nInvite code: " + el.dataset.code }).catch(() => {});
  else if (act === "rename") {
    const n = prompt("Your name in the diary", myLabel()); if (!n || !n.trim()) return;
    try { await api.setLabel(S.diaryId, S.user.userId, n.trim()); store.set("myLabel", n.trim()); await syncNow(true); toast("Changed"); } catch (e) { toast(friendly(e)); }
  }
  else if (act === "export") exportCsv();
  else if (act === "signout") {
    if (Object.keys(S.queue).length && !confirm("Some entries have not synced yet and will be lost if you sign out. Sign out anyway?")) return;
    if (S.unsub) S.unsub(); await api.signOut(); S.user = null; S.diaryId = null; store.del("diary"); render();
  }
  else if (act === "deldiary") {
    if (!confirm("Delete the whole diary, every entry, for everyone? This cannot be undone.")) return;
    if (prompt('Type DELETE to confirm') !== "DELETE") return;
    try { await api.deleteDiary(S.diaryId); store.del("cache." + S.diaryId); store.del("queue." + S.diaryId); store.del("child." + S.diaryId); S.diaryId = null; store.del("diary"); render(); toast("Diary deleted"); } catch (e) { toast(friendly(e)); }
  }
});
function friendly(e) {
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Invalid login/i.test(m)) return "That email and password don't match an account.";
  if (/already registered|already exists/i.test(m)) return "There is already an account with that email. Try signing in.";
  if (/Email not confirmed/i.test(m)) return "This email hasn't been confirmed. Turn off 'Confirm email' in Supabase, or confirm it from the email.";
  if (/Failed to fetch|NetworkError|network/i.test(m)) return "No connection. Try again when you have signal.";
  return m.replace(/^.*?: /, "");
}

async function afterSignIn() {
  render();
  let diaries = null;
  try { diaries = await api.myDiaries(S.user.userId); } catch (e) { S.online = false; }
  if (diaries) {
    const ids = diaries.map(d => d.diary_id);
    if (S.diaryId && !ids.includes(S.diaryId)) { S.diaryId = null; store.del("diary"); }
    if (!S.diaryId && ids.length) S.diaryId = ids[0];
    if (S.diaryId) store.set("diary", S.diaryId);
  }
  if (S.diaryId) { loadDiaryCache(); render(); startLive(); syncNow(true); } else render();
}

(async function boot() {
  try { S.user = await api.session(); } catch (e) { S.user = null; }
  if (S.user) await afterSignIn(); else render();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("/sw.js").catch(() => {});
})();
</script>
</body>
</html>
